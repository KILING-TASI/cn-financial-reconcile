[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "cn-financial-reconcile"
version = "0.2.1"
description = "中国财报字段核对：显式来源、未知与计算边界"
requires-python = ">=3.10"
license = {text = "MIT"}
[project.optional-dependencies]
pdf = ["pypdf>=4,<7", "pdfplumber>=0.11,<0.12"]
[tool.setuptools.packages.find]
include = ["cnreconcile*"]

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

[project.scripts]
cn-financial-reconcile = "cnreconcile._entry:main"

[tool.setuptools.data-files]
"share/cn-financial-reconcile/examples" = ["examples/demo.json"]
